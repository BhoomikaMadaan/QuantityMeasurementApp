spring.application.name=auth-service

server.port=8080

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.jwt.secret=mysecretkeymysecretkeymysecretkey123456
app.jwt.expiration=86400000

server.error.include-message=always
server.error.include-stacktrace=always

# Base URL of the quantityservice microservice. authservice proxies
# /api/quantity/** requests to this URL so the existing frontend
# (which only talks to port 8080) keeps working unchanged.
quantityservice.base-url=http://localhost:8081
