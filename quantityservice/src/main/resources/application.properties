spring.application.name=quantity-service

server.port=8081

spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-stacktrace=always

# ---- Legacy properties kept for util/ApplicationConfig.java + util/ConnectionPool.java ----
db.url=jdbc:h2:mem:quantitymeasurementdb
db.username=sa
db.password=
db.driver=org.h2.Driver
db.hikari.maximum-pool-size=10
db.hikari.minimum-idle=2
db.hikari.connection-timeout=30000
db.hikari.idle-timeout=600000
db.hikari.max-lifetime=1800000
db.hikari.pool-name=quantityservice-pool
db.hikari.connection-test-query=SELECT 1
